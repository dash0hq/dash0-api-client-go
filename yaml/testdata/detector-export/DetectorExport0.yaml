apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: detectorexport0
spec:
  groups:
  - interval: 1m
    name: Alerting
    rules:
    - alert: DetectorExport0
      annotations:
        dash0-enabled: "false"
        dash0-threshold-critical: "3"
        dash0-threshold-degraded: "2"
        dash0.com/baseline-direction: above
        dash0.com/baseline-spread-floor: "0.1"
        dash0.com/notification-channel-ids: email:critical-only
        description: Preserve executable authoring
        runbook_url: https://example.com/payments
        summary: Detector export
      expr: (((histogram_count(sum by (service_namespace, service_name) (increase({otel_metric_name
        = "dash0.spans.red", deployment_environment_name != "", dash0_service_qualified_name
        =~ "^(billing/payments|other/checkout|shop/checkout)$", dash0_operation_name
        != "", dash0_operation_name = "POST /pay", otel_span_status_code = "ERROR"}[max_of(2m,
        5m)])))) / (histogram_count(sum by (service_namespace, service_name) (increase({otel_metric_name
        = "dash0.spans.red", deployment_environment_name != "", dash0_service_qualified_name
        =~ "^(billing/payments|other/checkout|shop/checkout)$", dash0_operation_name
        != "", dash0_operation_name = "POST /pay"}[max_of(2m, 5m)]))) > 0) > $__threshold)
        and on (service_namespace, service_name) (ready > 0)) and on (service_namespace,
        service_name) ((last_over_time((sum by (service_namespace, service_name) (histogram_count(rate({otel_metric_name
        = "dash0.spans.red", deployment_environment_name != "", dash0_service_qualified_name
        =~ "^(billing/payments|other/checkout|shop/checkout)$", dash0_operation_name
        != "", dash0_operation_name = "POST /pay"}[5m]))))[1s:1s] offset 2m)) > 0.5)
      for: 2m
      keep_firing_for: 3m
      labels:
        team: payments
