name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        default: minor
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}

      - name: Calculate next version
        id: version
        run: |
          # Find the highest semver tag (not necessarily the latest by date)
          HIGHEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [ -z "$HIGHEST" ]; then
            HIGHEST="0.0.0"
          fi
          echo "Highest existing version: $HIGHEST"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$HIGHEST"
          case "${{ inputs.bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Next version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag does not exist
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.version.outputs.version }} already exists."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.25'

      - name: Update version.go
        run: |
          sed -i 's/const Version = ".*"/const Version = "${{ steps.version.outputs.version }}"/' version.go

      - name: Replace NEXT_RELEASE placeholders with actual version
        run: |
          find . -name '*.go' -o -name '*.txt' -o -name '*.md' | \
            grep -v vendor | grep -v .git | \
            xargs sed -i 's/<NEXT_RELEASE>/v${{ steps.version.outputs.version }}/g'

      - name: Generate changelog section
        uses: orhun/git-cliff-action@c93ef52f3d0ddcdcc9bd5447d98d458a11cd4f72 # v4.7.1
        id: changelog
        with:
          config: cliff.toml
          args: --unreleased --tag "v${{ steps.version.outputs.version }}"
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Prepend changelog section to CHANGELOG.md
        run: |
          SECTION="## v${{ steps.version.outputs.version }}"$'\n'"$(cat CHANGES.md)"
          # Insert the new section after the "# Changelog" header
          awk -v section="$SECTION" '
            /^# Changelog/ { print; print ""; print section; next }
            { print }
          ' CHANGELOG.md > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md
          rm -f CHANGES.md

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - name: Commit, tag, and push
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.go CHANGELOG.md compat.go api_compatibility_exceptions.txt
          git commit -m "chore: prepare release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD "v${{ steps.version.outputs.version }}"
