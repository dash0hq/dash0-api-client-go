name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.6.0) — without the "v" prefix'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format '$VERSION'. Expected semver without 'v' prefix (e.g., 1.6.0)."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Check tag does not exist
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.version }} already exists."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.25'

      - name: Update version.go
        run: |
          sed -i 's/const Version = ".*"/const Version = "${{ inputs.version }}"/' version.go

      - name: Generate changelog section
        uses: orhun/git-cliff-action@c93ef52f3d0ddcdcc9bd5447d98d458a11cd4f72 # v4.7.1
        id: changelog
        with:
          config: cliff.toml
          args: --unreleased --tag "v${{ inputs.version }}"
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Prepend changelog section to CHANGELOG.md
        run: |
          SECTION="## v${{ inputs.version }}"$'\n'"$(cat CHANGES.md)"
          # Insert the new section after the "# Changelog" header
          awk -v section="$SECTION" '
            /^# Changelog/ { print; print ""; print section; next }
            { print }
          ' CHANGELOG.md > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md
          rm -f CHANGES.md

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.go CHANGELOG.md
          git commit -m "chore: prepare release v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD "v${{ inputs.version }}"
