name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25']

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run make
        run: make

  api-compatibility:
    runs-on: ubuntu-latest
    # Only run on pull requests — not needed on main (main is the baseline).
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0  # gorelease needs full history and tags

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.25'

      - name: Install gorelease
        run: go install golang.org/x/exp/cmd/gorelease@latest

      - name: Check API compatibility
        run: |
          echo "Comparing against latest tag..."
          gorelease 2>&1 | tee /tmp/gorelease-output.txt
          # gorelease exits 0 if the version is valid, non-zero otherwise.
          # We print the output for review but do not fail the build — the
          # output is informational for PR reviewers to assess whether
          # breaking changes are intentional.
        continue-on-error: true

  collector-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25']

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache OTel Collector binary
        uses: actions/cache@v4
        with:
          path: testdata/.cache
          key: otelcol-${{ hashFiles('.otelcol-version') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Run collector integration test
        run: make test-collector

  live-tests:
    runs-on: ubuntu-latest
    # Only run on main branch pushes (secrets not available for fork PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.25'

      - name: Run live API tests
        env:
          DASH0_API_URL: ${{ secrets.DASH0_API_URL }}
          DASH0_AUTH_TOKEN: ${{ secrets.DASH0_AUTH_TOKEN }}
        run: go test -v -run TestLiveAPI ./...
